<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal Runner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1d113b, #0f172a 55%, #111827);
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .game-shell {
      max-width: 760px;
      width: min(92vw, 760px);
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 22px;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 0.8rem;
      font-size: clamp(2rem, 4vw, 3rem);
      color: #facc15;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #e2e8f0;
      margin-bottom: 1.2rem;
    }
    .box {
      background: rgba(59,130,246,0.08);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 16px;
      padding: 1rem 1.1rem;
      margin-top: 1rem;
    }
    .play-btn {
      display: inline-block;
      margin-top: 1rem;
      text-decoration: none;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      padding: 0.9rem 1.5rem;
      border-radius: 999px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <h1>Animal Runner</h1>
    <p>A puzzle game about a robot collecting stars in a magical forest I want a fun game for kids Make it colorful and easy</p>
    <div class="box">
      <strong>How to play:</strong>
      <p>Tap the button below to start the game. Keep going, collect points, and enjoy the challenge.</p>
      <button class="play-btn" onclick="alert('Game started! This generated game is ready to be customized further.')">Play Now</button>
    </div>
  </div>
</body>
</html>
