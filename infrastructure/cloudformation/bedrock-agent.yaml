AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Bedrock Agent with version control'

Parameters:
  Environment:
    Type: String
    Description: Deployment environment (dev, staging, prod)
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  
  AgentName:
    Type: String
    Description: Name of the Bedrock agent
    Default: CustomerSupportAgent
  
  FoundationModel:
    Type: String
    Description: Foundation model to use
    Default: anthropic.claude-3-sonnet-20240229-v1:0

Resources:
  BedrockAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AgentName}-${Environment}-Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockAgentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:Retrieve
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${KnowledgeBaseBucket}'
                  - !Sub 'arn:aws:s3:::${KnowledgeBaseBucket}/*'

  BedrockAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Ref AgentName
      FoundationModel: !Ref FoundationModel
      Instruction: !Sub |
        You are a helpful customer support agent. 
        Environment: ${Environment}
        Version: 1.0.0
      IdleSessionTTLInSeconds: 600
      RoleArn: !GetAtt BedrockAgentRole.Arn

Outputs:
  AgentId:
    Description: ID of the created Bedrock agent
    Value: !Ref BedrockAgent
  AgentArn:
    Description: ARN of the created Bedrock agent
    Value: !GetAtt BedrockAgent.Arn
  AgentRoleArn:
    Description: ARN of the IAM role for the agent
    Value: !GetAtt BedrockAgentRole.Arn
