AWSTemplateFormatVersion: "2010-09-09"
Description: "GameGenie - AWS Bedrock Agent for Kids Gaming Platform"

Parameters:
  Environment:
    Type: String
    Description: Deployment environment (dev, staging, prod)
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  
  AgentName:
    Type: String
    Description: Name of the Bedrock agent
    Default: GameGenie
  
  FoundationModel:
    Type: String
    Description: Foundation model to use
    Default: anthropic.claude-3-sonnet-20240229-v1:0

Resources:
  GameGenieAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AgentName}-${Environment}-Role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GameGenieAgentPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:Retrieve
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${ConfigBucket}"
                  - !Sub "arn:aws:s3:::${ConfigBucket}/*"

  GameGenieAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Ref AgentName
      FoundationModel: !Ref FoundationModel
      Instruction: !Sub |
        You are GameGenie, a friendly AI gaming assistant for kids. 
        Environment: ${Environment}
        Version: 1.0.0
        Your role is to help kids solve problems, play games, and turn their creative ideas into playable games!
      IdleSessionTTLInSeconds: 900
      RoleArn: !GetAtt GameGenieAgentRole.Arn

Outputs:
  AgentId:
    Description: ID of the created GameGenie Bedrock agent
    Value: !Ref GameGenieAgent
  AgentArn:
    Description: ARN of the created GameGenie Bedrock agent
    Value: !GetAtt GameGenieAgent.Arn
  AgentRoleArn:
    Description: ARN of the IAM role for the agent
    Value: !GetAtt GameGenieAgentRole.Arn
